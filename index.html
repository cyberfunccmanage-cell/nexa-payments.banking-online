<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protected Page</title>
  <style>
    /* Prevent text selection */
    body {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <h1>Secured Checkout / Content</h1>
  <p>Right click, shortcuts, and DevTools inspection are disabled on this page.</p>

<script>
  // 1. Right Click Block
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // 2. Keyboard Shortcuts Block (Ctrl+U, Ctrl+S, Ctrl+Shift+I, F12, etc.)
  document.addEventListener('keydown', (e) => {
    // F12 key
    if (e.keyCode === 123) {
      e.preventDefault();
      return false;
    }

    // Ctrl + U (View Source)
    if (e.ctrlKey && (e.keyCode === 85 || e.key === 'u' || e.key === 'U')) {
      e.preventDefault();
      return false;
    }

    // Ctrl + S (Save Page)
    if (e.ctrlKey && (e.keyCode === 83 || e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      return false;
    }

    // Ctrl + Shift + I (Inspect Element)
    // Ctrl + Shift + J (Console)
    // Ctrl + Shift + C (Inspect Element selector)
    if (e.ctrlKey && e.shiftKey && (
        e.keyCode === 73 || e.key === 'I' || e.key === 'i' ||
        e.keyCode === 74 || e.key === 'J' || e.key === 'j' ||
        e.keyCode === 67 || e.key === 'C' || e.key === 'c'
    )) {
      e.preventDefault();
      return false;
    }
  });

  // 3. DevTools Open Detection using Breakpoint Loop (Debugger Loop)
  // Jab bhi koi DevTools kholega, page break/freeze ho jayega
  setInterval(() => {
    const startTime = performance.now();
    debugger; // Freezes execution if DevTools is open
    const endTime = performance.now();
    
    // Agar DevTools open hone ki waja se execution delay ho jaye (>100ms)
    if (endTime - startTime > 100) {
      document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>DevTools is disabled on this page.</h1>";
    }
  }, 500);
</script>
</body>
</html>
